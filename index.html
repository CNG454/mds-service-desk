 const lock=!isA()&&stAdm(t.status),mine=isA()||t.assignee===me.id,canSt=mine&&!lock,canEdit=isA()||(t.creator===me.id&&!lock),sts=isA()?allSt():userSt();

const ADMIN_ACTS=['newU','editU','delU','newG','editG','delG','newC','editC','delC','newS','editS','delS','delT'];
document.addEventListener('click',e=>{
 if(!e.target.closest('.gbar')){const gb=$('#gsr');if(gb)gb.hidden=true}
 const sp=e.target.closest('[data-setpal]');if(sp){TH.pal=sp.dataset.setpal;applyTheme();render();return}
 const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;const y=window.scrollY;render();window.scrollTo(0,y);return}
 const v=e.target.closest('[data-v]');if(v){view=v.dataset.v;render();return}
 const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
 if(a==='retry'){boot();return}
 if(!me&&a!=='mode')return;
 if(ADMIN_ACTS.includes(a)&&!isA())return;
 if(a==='mask'){if(e.target===el)close();return}
 if(a==='close')close();
 else if(a==='logout')signOut();
 else if(a==='newT')tform();else if(a==='openT')detail(id);
 else if(a==='back'){view=prevView||'tix';render()}
 else if(a==='setst'){const k=db.tickets.find(x=>x.id===id);if(k)changeOne(k,'status',el.dataset.st)}
 else if(a==='editT')tedit(id);else if(a==='resetT')detail(curT);
 else if(a==='mode'){TH.mode=({auto:'light',light:'dark',dark:'auto'})[TH.mode];applyTheme();render()}
 else if(a==='newU')uform();else if(a==='editU')uform(id);
 else if(a==='newG')gform();else if(a==='editG')gform(id);
 else if(a==='newC')cform();else if(a==='editC')cform(id);else if(a==='newS')sform();else if(a==='editS')sform(id);
 else if(a==='delC')delChannel(id);else if(a==='delS')delStatus(id);else if(a==='take')takeTicket(id);
 else if(a==='delT')delTicket(id);else if(a==='delU')delUser(id);else if(a==='delG')delGroup(id);
});
document.addEventListener('keydown',e=>{if(e.key==='Tab'){const m=document.querySelector('.modal');if(m){const f=[...m.querySelectorAll('input:not([disabled]),select:not([disabled]),textarea,button')].filter(x=>x.offsetParent!==null);if(f.length){const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}}}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){const g=$('#gs');if(g){e.preventDefault();g.focus();g.select()}}
 if(e.key==='Enter'&&e.target.id==='gs'){e.preventDefault();const f=$('#gsr').querySelector('[data-id]');if(f)f.click()}
 if(e.key==='Escape'){close();const gb=$('#gsr');if(gb)gb.hidden=true}if(e.key==='Enter'&&e.target.matches('[data-act],[data-v]')&&!e.target.matches('button'))e.target.click()});

document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target,k=f.dataset.form,FD=new FormData(f),d=Object.fromEntries(FD),id=f.dataset.id;
 if(k!=='login'&&!me)return;
 if(['user','group','channel','status'].includes(k)&&!isA())return;
 if(k==='login'){await doLogin(f,d);return}
 if(k==='ticket'){
  const body={title:d.title.trim(),description:d.desc||'',priority:d.priority,group_id:d.group,due:d.due||null};
  if(isA()){body.assignee=d.assignee||null;body.channel_id=d.channel||null}
  await run(async()=>{const r=await sbx('/rest/v1/tickets',{method:'POST',headers:{Prefer:'return=representation'},body});const row=r&&r[0];if(!row)throw new Error('Not allowed');
   const via=isA()&&d.channel?cname(d.channel):'';
   await sbx('/rest/v1/ticket_log',{method:'POST',body:{ticket_id:row.id,actor:me.id,message:'created this ticket in '+gname(d.group)+(via?' via '+via:'')+(body.assignee?' and assigned it to '+uname(body.assignee):'')}});
   await syncNow();close();render();toast('Ticket MDS-'+row.no+' created')});return}
 if(k==='tupdate'){const t=db.tickets.find(x=>x.id===id);if(!t||!vis(t))return;
  const o={patch:{},logs:[]},w=Object.assign({},t),extra={row:{}};let n=0;
  ['group','assignee','status','priority','channel','due'].forEach(fl=>{if(d[fl]!==undefined&&plan(w,fl,d[fl],o))n++});
  const note=(d.note||'').trim(),mins=Math.max(0,Math.floor(Number(d.spent)||0));
  if(note){extra.comment=note;extra.kind='update';n++}
  if(mins&&(isA()||t.assignee===me.id)){const tot=(t.spent||0)+mins;extra.row.spent=tot;o.logs.push({m:'logged '+hm(mins)+' of work (total '+hm(tot)+')'});n++}
  if(!n)return toast('Nothing to update');
  await run(async()=>{await commit(t,o,extra);await syncNow();await detail(id)},'Ticket updated');return}
 if(k==='tedit'){const t=db.tickets.find(x=>x.id===id);if(!t||!(isA()||(t.creator===me.id&&!stAdm(t.status))))return;
  const nt=d.title.trim(),o={patch:{},logs:[]},row={};
  if(nt&&nt!==t.title){o.logs.push({m:'edited the subject',o:t.title,n:nt});row.title=nt}
  if((d.desc||'')!==t.desc){o.logs.push({m:'updated the description'});row.description=d.desc||''}
  if(!o.logs.length){close();return}
  await run(async()=>{await commit(t,o,{row});await syncNow();close();await detail(id)},'Ticket updated');return}
 if(k==='comment'){await run(async()=>{await sbx('/rest/v1/ticket_comments',{method:'POST',body:{ticket_id:id,author:me.id,body:d.m.trim(),kind:d.kind==='note'?'note':'reply'}});await syncNow();await detail(id)},d.kind==='note'?'Internal note added':'Reply posted');return}
 if(k==='user'){
  if(db.users.some(u=>u.email.toLowerCase()===d.email.trim().toLowerCase()&&u.id!==id))return toast('Email already in use');
  const p={name:d.name.trim(),email:d.email.trim(),role:d.role,groups:FD.getAll('groups'),active:d.active==='1'};
  if(!p.groups.length)return toast('Pick at least one group');
  if(id){if(id===me.id&&!p.active)return toast('You cannot disable yourself');if(id===me.id&&p.role!=='admin')return toast('You cannot remove your own admin role')}
  await run(async()=>{
   if(id){const u=U(id),fx={};if(p.email.toLowerCase()!==u.email.toLowerCase())fx.email=p.email;if(d.pass)fx.password=d.pass;if(p.active!==u.active)fx.active=p.active;
    if(Object.keys(fx).length)await fn(Object.assign({action:'update',id},fx));await patchProf(id,p)}
   else await fn(Object.assign({action:'create',password:d.pass},p));
   await syncNow();close();render()},'User saved');return}
 if(k==='channel'){const nm=d.name.trim();if(db.channels.some(c=>c.name.toLowerCase()===nm.toLowerCase()&&c.id!==id))return toast('Channel name already exists');
  await run(async()=>{if(id){const r=await sbx('/rest/v1/channels?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=representation'},body:{name:nm,description:d.desc||''}});if(!r||!r.length)throw new Error('Not allowed')}
   else await sbx('/rest/v1/channels',{method:'POST',body:{name:nm,description:d.desc||''}});await syncNow();close();render()},'Channel saved');return}
 if(k==='status'){const nm=d.name.trim();if(db.statuses.some(z=>z.name.toLowerCase()===nm.toLowerCase()&&z.id!==id))return toast('Status name already exists');
  const o=id?db.statuses.find(x=>x.id===id):null;
  await run(async()=>{
   if(o){const b=o.sys?{tone:d.tone,finished:d.done==='1'}:{name:nm,tone:d.tone,admin_only:d.adm==='1',finished:d.done==='1'};const r=await sbx('/rest/v1/statuses?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=representation'},body:b});if(!r||!r.length)throw new Error('Not allowed')}
   else await sbx('/rest/v1/statuses',{method:'POST',body:{name:nm,tone:d.tone,admin_only:d.adm==='1',finished:d.done==='1',sort:db.statuses.reduce((m,z)=>Math.max(m,z.sort||0),0)+1}});
   await syncNow();close();render()},'Status saved');return}
 if(k==='group'){const nm=d.name.trim();if(db.groups.some(g=>g.name.toLowerCase()===nm.toLowerCase()&&g.id!==id))return toast('Group name already exists');
  const mem=FD.getAll('members');
  await run(async()=>{let gid=id;
   if(id){const r=await sbx('/rest/v1/groups?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=representation'},body:{name:nm,description:d.desc||''}});if(!r||!r.length)throw new Error('Not allowed')}
   else{const r=await sbx('/rest/v1/groups',{method:'POST',headers:{Prefer:'return=representation'},body:{name:nm,description:d.desc||''}});gid=r&&r[0]&&r[0].id}
   if(id)for(const u of db.users){const has=inG(u,gid),want=mem.includes(u.id);if(want!==has)await patchProf(u.id,{groups:want?u.groups.concat(gid):u.groups.filter(x=>x!==gid)})}
   await syncNow();close();render()},'Group saved');return}
});
